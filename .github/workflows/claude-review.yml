name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Fork PRs get no secrets; only review PRs from this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated reviewer for this AI-assisted SDLC repo.
            1. Read CLAUDE.md and .github/claude-review.md.
            2. Get the PR title with `gh pr view`. Its prefix ([requirements], [design],
               [acceptance-test], [implement], [deploy]) selects the checklist. Also apply "All PRs".
            3. Review the diff (`gh pr diff`) and read any files you need for context.
            4. Post one comment with `gh pr comment`, in Thai, using the output format in
               .github/claude-review.md. Use inline comments for line-specific issues.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
